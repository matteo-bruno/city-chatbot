<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City accessibility assistant</title>
<style>
  :root {
    --bg: #ffffff; --fg: #16181d; --muted: #6b7280; --line: #e5e7eb;
    --accent: #1f6feb; --bubble-user: #eef4ff; --bubble-bot: #f6f7f9;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101215; --fg: #e8eaed; --muted: #9aa1ab; --line: #272b31;
      --accent: #5b9cff; --bubble-user: #1a2436; --bubble-bot: #191c21;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
  header p.model { font-family: var(--mono); font-size: 11px; opacity: .75; }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .msg { margin-bottom: 14px; padding: 10px 13px; border-radius: 12px; white-space: pre-wrap; }
  .msg.user { background: var(--bubble-user); }
  .msg.bot { background: var(--bubble-bot); }
  .msg.err { background: #fdecec; color: #8a1c1c; }
  @media (prefers-color-scheme: dark) { .msg.err { background: #3a1d1d; color: #ffb4b4; } }
  .role { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
  .tools { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: -6px 0 12px 4px; }
  .examples { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  .examples button {
    font: inherit; font-size: 13px; cursor: pointer; padding: 6px 11px;
    border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--fg);
  }
  .examples button:hover { border-color: var(--accent); color: var(--accent); }
  footer { border-top: 1px solid var(--line); padding: 12px 16px; }
  form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; font: inherit; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.send { font: inherit; padding: 10px 18px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
  button.send[disabled] { opacity: .5; cursor: default; }
  .hint { max-width: 760px; margin: 8px auto 0; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1 id="title">City accessibility assistant</h1>
  <p id="subtitle">connecting…</p>
  <p class="model" id="modelTag"></p>
</header>

<div id="log"><div class="wrap" id="logInner">
  <div class="msg bot">
    <div class="role">assistant</div>Ask me about proximity times, whether an area is a 15-minute neighbourhood, or how the score is computed.
    <div class="examples" id="examples"></div>
  </div>
</div></div>

<footer>
  <form id="form">
    <input id="input" type="text" autocomplete="off" placeholder="Ask about this city…" />
    <button class="send" id="send" type="submit">Send</button>
  </form>
  <p class="hint">Figures come from the prepared dataset. Conversation history is kept in this
    page only. <a href="/api/city">dataset</a> · <a href="/health">health</a></p>
</footer>

<script>
// The API base: same origin by default. Point this at the backend when the page
// is hosted elsewhere, and set CITYCHAT_ALLOW_ORIGINS on the server to match.
const API = window.CITYCHAT_API || "";

// Stateless by design: we hold the transcript here and send it back each turn.
// The transcript is in the active provider's own format, so we send the
// provider tag back too and the server rejects a mismatch instead of failing
// on a malformed request.
let history = [];
let historyProvider = null;
let busy = false;

const logInner = document.getElementById("logInner");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");

const EXAMPLES = [
  "What is the proximity time?",
  "What does it mean to be a 15-minute city?",
  "Is this city a 15-minute city?",
  "Is Rogoredo a 15-minute neighbourhood?",
  "Which neighbourhoods are worst served?",
  "How is the score computed?",
];

function bubble(role, text, cls) {
  const el = document.createElement("div");
  el.className = "msg " + (cls || (role === "user" ? "user" : "bot"));
  const label = document.createElement("div");
  label.className = "role";
  label.textContent = role;
  el.appendChild(label);
  const body = document.createElement("span");
  body.textContent = text || "";
  el.appendChild(body);
  logInner.appendChild(el);
  scroll();
  return body;
}

function scroll() {
  const log = document.getElementById("log");
  log.scrollTop = log.scrollHeight;
}

async function ask(message) {
  if (busy || !message) return;
  busy = true;
  send.disabled = true;
  input.value = "";
  bubble("you", message);

  const body = document.createElement("div");
  body.className = "tools";
  logInner.appendChild(body);
  const target = bubble("assistant", "");

  try {
    const response = await fetch(API + "/api/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, history, provider: historyProvider }),
    });
    if (response.status === 409) {
      // The backend switched provider under us; drop the stale transcript.
      history = [];
      historyProvider = null;
      const detail = await response.json().catch(() => ({}));
      bubble("error", (detail.detail || "Conversation reset.") + " Ask again to start over.", "err");
      return;
    }
    if (!response.ok) throw new Error("HTTP " + response.status);

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const frames = buffer.split("\n\n");
      buffer = frames.pop();
      for (const frame of frames) {
        const line = frame.split("\n").find((l) => l.startsWith("data: "));
        if (!line) continue;
        const event = JSON.parse(line.slice(6));
        if (event.type === "text") {
          target.textContent += event.text;
          scroll();
        } else if (event.type === "tool_call") {
          body.textContent += (body.textContent ? " · " : "looking up: ") + event.name;
          scroll();
        } else if (event.type === "error") {
          bubble("error", event.message, "err");
        } else if (event.type === "done") {
          if (event.history) history = event.history;
          if (event.provider) historyProvider = event.provider;
          if (!target.textContent && !event.error) target.textContent = "(no answer returned)";
        }
      }
    }
  } catch (err) {
    bubble("error", "Request failed: " + err.message, "err");
  } finally {
    busy = false;
    send.disabled = false;
    input.focus();
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  ask(input.value.trim());
});

const examplesBox = document.getElementById("examples");
EXAMPLES.forEach((text) => {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = text;
  b.onclick = () => ask(text);
  examplesBox.appendChild(b);
});

fetch(API + "/api/city")
  .then((r) => r.json())
  .then((d) => {
    const ds = d.dataset || {};
    document.getElementById("title").textContent = (ds.city || "City") + " accessibility assistant";
    const walk = (d.indicators && d.indicators.modes && d.indicators.modes.walking) || null;
    const bits = [];
    if (ds.population_total) bits.push(Math.round(ds.population_total).toLocaleString() + " residents");
    if (ds.cells) bits.push(ds.cells.toLocaleString() + " cells");
    if (walk && walk.proximity_time_city_min) {
      bits.push(walk.proximity_time_city_min + " min average walk, F15 " + walk.F15_residents_within_15min_pct + "%");
    }
    if (ds.data_vintage) bits.push(ds.data_vintage);
    document.getElementById("subtitle").textContent = bits.join(" · ");
    if (ds.model) {
      document.getElementById("modelTag").textContent = ds.provider + " / " + ds.model;
    }
  })
  .catch(() => {
    document.getElementById("subtitle").textContent = "backend unreachable";
  });
</script>
</body>
</html>
